[project]
name = "sma"
version = "0.1.0.dev0"
description = "SMA：内容创作垂直领域的 agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9"]

[project.scripts]
sma = "sma.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# B008：typer 的参数默认值就是这种写法；RUF001–003：中文全角标点不算歧义字符；
# E501：中文按两个字符宽计算，行宽交给人工把握
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]
