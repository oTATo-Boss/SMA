id: market-intel
name: 市场研究
version: 0.2.0
description: 找被市场验证过的机会：搜本赛道和相邻赛道近期明显超过作者常态的作品，拆解机制，交爆款条目和机会简报
kind: worker
inputs:
  - { type: strategy, required: true }
  - { type: benchmarks, required: false }
  - { type: data-files, required: false }
outputs:
  - { type: viral-reference, many: true }
  - { type: opportunity-brief }
engine:
  prefer: [codex]
model:
  family: any
  tier: strong
reasoning: high
sandbox: step-write
network: web            # M1 用引擎自带的网页搜索；M2 起改用 sma-research 工具（tools-only）
skills:
  - { name: content-planning, required: false }
knowledge:
  - knowledge/研究方法.md
memory:
  read: true
limits: { timeout_s: 1500, max_attempts: 3, max_output_kb: 256 }
